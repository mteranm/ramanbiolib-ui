name: Build PyInstaller App

on:
  push:
    branches:
      - main   # This triggers the build when changes are pushed to the 'main' branch
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.7

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build the application using PyInstaller
        run: |
          pyinstaller app.spec --clean  # Build your application with PyInstaller

      - name: Upload the executable as an artifact
        uses: actions/upload-artifact@v2
        with:
          name: ramanbiolib-ui
          path: dist/ramanbiolib-ui