name: Build PyInstaller App

on:
  push:
    branches:
      - main   # This triggers the build when changes are pushed to the 'main' branch
  pull_request:
    branches:
      - main
  workflow_dispatch:   # Allows manual trigger of the workflow

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest]  # Define platforms in the matrix

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for VC++ Redistributable
        run: |
          Get-Command "vcredist_x64.exe" -ErrorAction SilentlyContinue || echo "VC++ Redistributable not installed."
        shell: powershell
        
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: 3.7

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Find package data files (CSV)
        run: |
          python -c "import os, ramanbiolib; print(os.path.join(os.path.dirname(ramanbiolib.__file__), 'db'))" > data_directory.txt

      - name: Set DATA_DIR based on OS
        run: |
          $env:DATA_DIR = Get-Content -Path "data_directory.txt" | Out-String

      #- name: Add binary and data files to PyInstaller
      #  run: |
      #    pyinstaller --add-data "src/templates/index.html;src/templates" src/app.py

      - name: Build the application using PyInstaller
        run: |
          pyinstaller -y app.spec --clean  # Build your application with PyInstaller

      - name: List generated files (Windows)
        run: |
          Get-ChildItem -Path dist/ramanbiolib-ui -Recurse
        shell: pwsh

      - name: Upload the executable as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ramanbiolib-ui-${{ matrix.os }}  # Dynamically name the artifact
          path: dist/ramanbiolib-ui.exe # Adjust path if necessary